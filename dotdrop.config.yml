config:
  backup: false
  banner: false
  create: true
  dotpath: ~/.dotfiles
  keepdot: false
  link_dotfile_default: absolute
  link_on_import: absolute
  longkey: false
profiles:
  default:
    dotfiles:
    # Zsh configuration files
    - d_zsh_plugins
    - f_zsh_aliases
    - f_zsh_completions
    - f_zsh_functions
    - f_zsh_settings
    - f_zprofile
    - f_zshenv
    - f_zshrc
    - f_zlogin
    - f_zlogout

    # Other configuration files
    - d_aerospace
    - d_bat
    - d_btop
    - f_composer
    - d_eza
    - d_fastfetch
    - f_gh_config
    - d_gh-copilot
    - d_ghostty
    - d_git-cliff
    - d_k9s
    - d_mise
    - f_vite_plus_config
    - d_nvim
    - d_rex
    - d_starship
    - d_yazi
    - d_zed
    - f_curlrc
    - f_git_config
    - f_git_ignore_global
    - f_gpg-agent
    - f_hushlogin
    - f_ssh_allowed_signers
    - f_ssh_config
    - d_scripts
  macos:
    dotfiles:
    - f_vscode_custom_js
    - f_vscode_custom_css
    - d_vscode_snippets
    - f_vscode_settings
    - f_vscode_keybindings

dotfiles:
  d_zsh_plugins:
    src: config/zsh/plugins
    dst: ~/.config/zsh/plugins
  f_zsh_aliases:
    src: config/zsh/aliases.zsh
    dst: ~/.config/zsh/aliases.zsh
  f_zsh_completions:
    src: config/zsh/completions.zsh
    dst: ~/.config/zsh/completions.zsh
  f_zsh_functions:
    src: config/zsh/functions.zsh
    dst: ~/.config/zsh/functions.zsh
  f_zsh_settings:
    src: config/zsh/settings.zsh
    dst: ~/.config/zsh/settings.zsh
  f_zprofile:
    src: config/zsh/zprofile
    dst: ~/.zprofile
  f_zshenv:
    src: config/zsh/zshenv
    dst: ~/.zshenv
  f_zshrc:
    src: config/zsh/zshrc
    dst: ~/.zshrc
  f_zlogin:
    src: config/zsh/zlogin
    dst: ~/.zlogin
  f_zlogout:
    src: config/zsh/zlogout
    dst: ~/.zlogout
  d_aerospace:
    src: config/aerospace
    dst: ~/.config/aerospace
  d_bat:
    src: config/bat
    dst: ~/.config/bat
  d_btop:
    src: config/btop
    dst: ~/.config/btop
  d_eza:
    src: config/eza
    dst: ~/.config/eza
  d_fastfetch:
    src: config/fastfetch
    dst: ~/.config/fastfetch
  f_gh_config:
    src: config/gh/config.yml
    dst: ~/.config/gh/config.yml
  d_gh-copilot:
    src: config/gh-copilot
    dst: ~/.config/gh-copilot
  d_ghostty:
    src: config/ghostty
    dst: ~/.config/ghostty
  d_git-cliff:
    src: config/git-cliff
    dst: ~/.config/git-cliff
  d_k9s:
    src: config/k9s
    dst: ~/.config/k9s
    link: link_children
  d_nvim:
    src: config/nvim
    dst: ~/.config/nvim
    link: link_children
  d_rex:
    src: config/rex
    dst: ~/.config/rex
  d_starship:
    src: config/starship
    dst: ~/.config/starship
  d_yazi:
    src: config/yazi
    dst: ~/.config/yazi
  d_zed:
    src: config/zed
    dst: ~/.config/zed
    link: link_children
  f_curlrc:
    src: config/curlrc
    dst: ~/.curlrc
  f_git_config:
    src: config/git/config
    dst: ~/.gitconfig
  f_git_ignore_global:
    src: config/git/ignore_global
    dst: ~/.gitignore_global
  f_gpg-agent:
    src: config/gnupg/gpg-agent.conf
    dst: ~/.gnupg/gpg-agent.conf
  f_hushlogin:
    src: config/hushlogin
    dst: ~/.hushlogin
  f_ssh_allowed_signers:
    src: config/ssh/allowed_signers
    dst: ~/.ssh/allowed_signers
  f_ssh_config:
    src: config/ssh/config
    dst: ~/.ssh/config
  d_scripts:
    src: scripts
    dst: ~/.scripts
  f_vscode_custom_js:
    src: config/vscode/custom.js
    dst: ~/.vscode/custom.js
  f_vscode_custom_css:
    src: config/vscode/custom.css
    dst: ~/.vscode/custom.css
  d_vscode_snippets:
    src: config/vscode/snippets
    dst: ~/Library/Application Support/Code/User/snippets
  f_vscode_settings:
    src: config/vscode/settings.json
    dst: ~/Library/Application Support/Code/User/settings.json
  f_vscode_keybindings:
    src: config/vscode/keybindings.json
    dst: ~/Library/Application Support/Code/User/keybindings.json
  d_mise:
    src: config/mise
    dst: ~/.config/mise
  f_vite_plus_config:
    src: config/vite-plus/config.json
    dst: ~/.config/vite-plus/config.json
  f_composer:
    src: config/composer/composer.json
    dst: ~/.config/composer/composer.json
