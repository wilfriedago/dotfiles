# =============================================================================================
# ~/.config/iris/config.toml
# =============================================================================================
# IRIS — inline shell autocompletion overlay
#
# IRIS reads keys from the PTY before zsh sees them, so anything left on a default here is
# silently stolen from whatever used to own it.
# Tab is IRIS's — fzf-tab was removed so that IRIS owns completion.
# For docs and more info, see: https://github.com/versenilvis/iris
# =============================================================================================
# License: MIT Copyright (c) 2025 Wilfried Kirin AGO <https://wilfriedago.me>
# =============================================================================================

[core]
version = 1
shell = "zsh"
mode = "history"          # "last" | "spec" | "history"
debug = false
expand-alias = true
auto-execute = false   # never run a suggestion without an explicit Enter

[ui]
style = "modern"       # "modern" | "classic"
ghost-text = true
hidden-files = true    # suggest dotfiles/dotdirs in path completion (default: false)
max-suggestions = 50
max-height = 12
nerd-fonts = true

[keybindings]
toggle-mode = "ctrl+r"
toggle-menu = "shift+tab"
select = "tab"
navigate-up = "up"
navigate-down = "down"
navigate-right = "right"

[git]
filter-active-branch = true
deduplicate-branches = true

[updater]
check-on-startup = true
channel = "stable"
auto-update = 0        # 0 = notify only; updates stay a deliberate `iris update`

[ai]
enabled = false
